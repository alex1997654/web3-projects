[package]
name = "escrow"
version = "0.1.0"
description = "Two-party SPL token escrow with partial fills and expiry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
anchor-spl = "=0.30.1"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
[lints.rust.unexpected_cfgs]
level = "allow"
