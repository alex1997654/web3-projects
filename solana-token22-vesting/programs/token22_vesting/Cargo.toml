[package]
name = "token22_vesting"
version = "0.1.0"
description = "Token-2022 vesting: cliff plus linear unlock, claims, revocation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token22_vesting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
anchor-spl = "=0.30.1"
# Raw Token-2022 instruction packing for the CPI paths. The on-chain
# Token-2022 revision writes accounts the 3.0.x typed unpackers model
# imprecisely, so instructions are packed and invoked without in-process
# deserialization of token state.
spl-token-2022 = "=3.0.4"
spl-associated-token-account = "=3.0.4"
