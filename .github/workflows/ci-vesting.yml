name: ci-vesting
on:
  push:
    paths:
      - "solana-token22-vesting/**"
      - ".github/workflows/ci-vesting.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep RUSTUP_TOOLCHAIN unset everywhere: the anchor 0.30.1 IDL helper
  # reads it and runs cargo with a broken interpolated toolchain argument
  # (the literal '{toolchain}' error). The rustup default set below is what
  # every cargo invocation sees. Same lesson ci-escrow documented.

jobs:
  test:
    name: fmt, clippy, anchor test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: solana-token22-vesting
    steps:
      - uses: actions/checkout@v4

      # Single toolchain, 1.99.1, the same host this project is validated
      # on locally. The vendored patches under patches/ (anchor-syn,
      # proc-macro2 without the super_unstable emission, ark-ff-macros
      # with tolerant MontFp parsing) keep the whole graph buildable here.
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Install Solana CLI (Agave) 1.18.26
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # No --locked: anchor-cli 0.30.1's published lockfile pins deps that
      # fail type inference on rustc 1.99 (E0282); the open resolution
      # compiles.
      - name: Install Anchor CLI 0.30.1
        run: cargo install anchor-cli --version 0.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - name: Enable yarn
        run: corepack enable || npm install -g yarn@1.22.22

      # yarn, not npm: package.json uses the resolutions field to pin one
      # @solana/web3.js copy, and npm ignores resolutions.
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Generate local test wallet
        run: bash scripts/setup-wallet.sh

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -p token22_vesting --all-targets -- -D warnings

      - name: anchor test (build, local validator, integration suite)
        run: anchor test
