name: ci-vesting
on:
  push:
    paths:
      - "solana-token22-vesting/**"
      - ".github/workflows/ci-vesting.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pin every cargo invocation to 1.99.1, including the one anchor's IDL
  # helper spawns (it honors RUSTUP_TOOLCHAIN; without this the runner's
  # own default can leak through and the host graph lands on a compiler
  # the pinned solana-sdk 1.18.26 does not compile on). cargo-build-sbf
  # is unaffected: it invokes cargo +solana explicitly, which beats this
  # variable.
  RUSTUP_TOOLCHAIN: "1.99.1"
  # The runner image exports RUSTC_BOOTSTRAP=1; without clearing it,
  # proc-macro2's build probe flips into a code path this toolchain
  # cannot compile. The vendored patches/proc-macro2 already refuses to
  # emit that path, and clearing the variable keeps the host identical
  # to the validated local environment.
  RUSTC_BOOTSTRAP: ""

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-token22-vesting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Solana CLI 1.18.26
        run: |
          curl -sSfL https://release.anza.xyz/v1.18.26/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: npm install -g @coral-xyz/anchor-cli@0.30.1

      - name: Enable yarn
        run: corepack enable || npm install -g yarn@1.22.22

      # yarn, not npm: package.json uses the resolutions field to pin one
      # @solana/web3.js copy, and npm ignores resolutions.
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "solana-token22-vesting"
          # v2 cache namespace: earlier runs saved artifacts built by the
          # runner's leaked default compiler (pre RUSTUP_TOOLCHAIN pin),
          # including proc-macro dylibs that misbehave under 1.99.1. Start
          # the cache over under the pinned toolchain.
          prefix-key: "vesting-v2"

      - name: Generate local test wallet
        run: bash scripts/setup-wallet.sh

      - name: Build
        run: anchor build

      - name: Integration tests (local validator)
        run: anchor test

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-token22-vesting
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -p token22_vesting --all-targets -- -D warnings
