name: ci-vesting
on:
  push:
    paths:
      - "solana-token22-vesting/**"
      - ".github/workflows/ci-vesting.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pin every cargo invocation to 1.99.1, including the one anchor's IDL
  # helper spawns (it honors RUSTUP_TOOLCHAIN; without this the runner's
  # own default can leak through and the host graph lands on a compiler
  # the pinned solana-sdk 1.18.26 does not compile on). cargo-build-sbf
  # is unaffected: it invokes cargo +solana explicitly, which beats this
  # variable.
  RUSTUP_TOOLCHAIN: "1.99.1"
  # RUSTC_BOOTSTRAP stays at the runner default (1). Setting it to an
  # empty string breaks this cargo-build-sbf build: its script takes a
  # path with an unexpanded {toolchain} placeholder whenever the
  # variable is set-but-empty. The vendored patches/proc-macro2 already
  # refuses to emit the nightly-only code path that RUSTC_BOOTSTRAP=1
  # would otherwise unlock, so the default is safe here.

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-token22-vesting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Solana CLI 1.18.26
        run: |
          curl -sSfL https://release.anza.xyz/v1.18.26/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI 0.30.1
        # cargo install, not npm: the npm wrapper drives the IDL helper with
        # its own environment. No --locked: anchor-cli 0.30.1's published
        # lockfile pins deps that fail type inference on rustc 1.99; the
        # open resolution compiles (same lesson as ci-escrow).
        run: cargo install anchor-cli --version 0.30.1

      - name: Enable yarn
        run: corepack enable || npm install -g yarn@1.22.22

      # yarn, not npm: package.json uses the resolutions field to pin one
      # @solana/web3.js copy, and npm ignores resolutions.
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      # No rust-cache: it also restores ~/.rustup state, including the
      # rustup 'solana' toolchain link that cargo-build-sbf manages, and a
      # link restored from a run where it was created with a relative path
      # breaks every later SBF build with a literal '{toolchain}' error.
      # Cold builds cost minutes; the link always starts clean this way.

      - name: Generate local test wallet
        run: bash scripts/setup-wallet.sh

      - name: anchor test (build, local validator, integration suite)
        run: anchor test

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-token22-vesting
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -p token22_vesting --all-targets -- -D warnings
