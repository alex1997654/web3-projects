name: ci-amm
on:
  push:
    paths: ["solana-anchor-amm/**", ".github/workflows/ci-amm.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, unit tests, anchor test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: solana-anchor-amm

    steps:
      - uses: actions/checkout@v4

      # Single host toolchain, same as the development box where this whole
      # build is proven. Anchor 0.30.1's IDL helper only probes the nightly
      # proc_macro Span surface when RUSTC_BOOTSTRAP is set AND the compiler
      # still carries that API; on 1.99.1 the probe fails cleanly and
      # proc-macro2 falls back to its stable path, which is what the local
      # green builds do.
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy && rustup default 1.99.1

      # release.solana.com intermittently fails TLS from CI runners; the
      # solana-labs GitHub release carries the identical tarball.
      - name: Install Solana CLI 1.18.26
        run: |
          curl -sfL -o /tmp/solana.tar.bz2 \
            https://github.com/solana-labs/solana/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          mkdir -p "$HOME/.local/share"
          tar -xjf /tmp/solana.tar.bz2 -C "$HOME/.local/share"
          echo "$HOME/.local/share/solana-release/bin" >> "$GITHUB_PATH"

      # crates.io build, not the npm binary: the npm 0.30.1 binary forces
      # --cfg procmacro2_semver_exempt into the IDL pass RUSTFLAGS, which
      # breaks proc-macro-error on stable hosts. Unlocked install like the
      # development box (built there with this same 1.99.1).
      - name: Install Anchor CLI 0.30.1
        run: cargo install anchor-cli --version 0.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.1
          cache: yarn
          cache-dependency-path: solana-anchor-amm/yarn.lock

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-anchor-amm

      # Downloads platform-tools v1.41 into the solana cache (rust and llvm)
      # and swaps in the cargo 1.79 binary from v1.45: the committed
      # Cargo.lock is v4 and the cargo bundled with v1.41 (1.75) cannot read
      # v4, while cargo >=1.80 passes --check-cfg flags the v1.41 rustc
      # rejects. cargo-build-sbf invokes cargo +solana explicitly, so the
      # host default does not interfere.
      - name: Fix sbf cargo (lockfile v4 vs platform-tools cargo 1.75)
        run: ./scripts/fix-sbf-cargo.sh

      # The program keypair is never committed. CI generates a fresh one and
      # syncs declare_id!/Anchor.toml to it so build and tests stay
      # self-consistent.
      - name: Prepare program and wallet keypairs
        run: |
          mkdir -p wallets target/deploy
          solana-keygen new --no-bip39-passphrase --force -o wallets/dev.json
          solana-keygen new --no-bip39-passphrase --force -o target/deploy/amm-keypair.json
          # Cached artifacts from earlier runs carry the previous random
          # program identity in the .so binary and the IDL; a fresh keypair
          # plus stale binary/IDL is exactly DeclaredProgramIdMismatch.
          rm -f target/deploy/amm.so
          rm -rf target/idl
          # CI never deploys to devnet. anchor keys sync rewrites
          # [programs.localnet] and declare_id! but leaves any
          # [programs.devnet] entry stale; a stale entry makes the
          # anchor test client target the old address while the
          # deployed binary declares the fresh keypair id, which is
          # DeclaredProgramIdMismatch on every instruction. Drop the
          # devnet section so exactly one identity exists.
          sed -i '/^\[programs\.devnet\]$/,/^\[/{/^\[programs\.devnet\]$/d;/^\[/!d}' Anchor.toml
          anchor keys sync

      - name: Build program
        run: anchor build

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests (math)
        run: cargo test -p amm

      - name: Integration tests (anchor test, local validator)
        run: anchor test
