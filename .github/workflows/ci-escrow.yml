name: ci-escrow
on:
  push:
    paths: ["solana-anchor-escrow/**", ".github/workflows/ci-escrow.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, unit tests, anchor test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: solana-anchor-escrow

    steps:
      - uses: actions/checkout@v4

      # Single toolchain, 1.99.1. Keep RUSTUP_TOOLCHAIN unset everywhere:
      # older anchor-lang-idl helpers read it and run cargo with a broken
      # interpolated toolchain argument.
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Install Solana CLI (Agave) 1.18.26
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # No --locked: anchor-cli 0.30.1's published lockfile pins an old
      # anchor-lang-idl whose IDL helper forces a rustc cfg that no modern
      # compiler accepts. The open resolution pulls the fixed helper.
      - name: Install Anchor CLI 0.30.1
        run: cargo install anchor-cli --version 0.30.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --locked -p escrow

      - name: Generate a throwaway program keypair (never committed)
        run: |
          mkdir -p target/deploy
          solana-keygen new -o target/deploy/escrow-keypair.json --no-bip39-passphrase
          anchor keys sync

      - name: anchor test (local validator, integration suite)
        run: anchor test

      - name: Syntax-check the demo frontend
        run: node --input-type=module --check < docs/app.js